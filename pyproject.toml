[project]
name = "org_enums"
version = "1.0.0"
description = "Shared StrEnum definitions for organization projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nick Elsey"}]
dependencies = [
    "pytest>=8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
